<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Para Ti, Arenita! 🌻</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background-color: #fff9db; /* Amarillo pálido de fondo */
    color: #333;
  }

  /* --- Sección de Portada (Fondo) --- */
  .portada {
    position: relative;
    width: 100%;
    height: 100vh; /* Ocupa todo el alto de la pantalla */
    background-image: url('image_0.png'); /* TU FOTO DE FONDO */
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }

  .cabecera {
    background: rgba(0,0,0,0.6);
    padding: 20px 40px;
    border-radius: 15px;
    text-align: center;
  }

  h2 {
    color: #ffd700; /* Dorado para el nombre */
    margin-top: 0;
  }

  .boton {
    display: inline-block;
    padding: 10px 20px;
    margin-top: 20px;
    background-color: #ffd700;
    color: #333;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
  }

  /* --- Sección de Galería (Fotos Mejoradas) --- */
  .galeria {
    padding: 50px 20px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px; /* Espacio entre fotos */
  }

  .foto-petalo {
    position: relative;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    
    /* Animación base */
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  /* Imagen dentro del pétalo */
  .foto-petalo img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Ajusta la foto sin deformarla */
  }

  /* --- Marco Floral (con pseudo-elemento) --- */
  .foto-petalo::after {
    content: '';
    position: absolute;
    top: -5px;
    left: -5px;
    right: -5px;
    bottom: -5px;
    border: 5px solid transparent;
    border-radius: 50%;
    /* Reemplaza con una URL de marco floral real si tienes una */
    border-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="10" r="10" fill="yellow" stroke="gold" stroke-width="2"/><circle cx="90" cy="50" r="10" fill="yellow" stroke="gold" stroke-width="2"/><circle cx="50" cy="90" r="10" fill="yellow" stroke="gold" stroke-width="2"/><circle cx="10" cy="50" r="10" fill="yellow" stroke="gold" stroke-width="2"/><circle cx="30" cy="30" r="8" fill="lightyellow" stroke="goldenrod" stroke-width="1.5"/><circle cx="70" cy="30" r="8" fill="lightyellow" stroke="goldenrod" stroke-width="1.5"/><circle cx="70" cy="70" r="8" fill="lightyellow" stroke="goldenrod" stroke-width="1.5"/><circle cx="30" cy="70" r="8" fill="lightyellow" stroke="goldenrod" stroke-width="1.5"/></svg>') 30;
    pointer-events: none; /* No interfiere con el clic */
  }

  /* --- Animaciones al Tocar (Hover) --- */
  .foto-petalo:hover {
    transform: scale(1.1) rotate(5deg); /* Crece y gira un poco */
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  }

  /* --- Estilo Específico de las Fotos de Arena --- */
  /* Puedes ajustar esto para cada foto si lo necesitas */
  .foto-arena {
    /* Por ejemplo, ajustar la posición si están cortadas */
  }

</style>
</head>
<body>

  <!-- Portada Principal -->
  <div class="portada">
    <div class="cabecera">
      <p>💛 🌻 💛 🌻</p>
      <h2>¡Para Ti, Arenita! 🌻</h2>
      <p>Un girasol digital y una aventura submarina para iluminar tu día.</p>
      <p>Tu sonrisa brilla con la misma fuerza que el sol de Fondo de Bikini. ¡Gracias por existir!</p>
      <a href="#" class="boton">¡Enviar más Flores de Fondo de Bikini! 🌼</a>
    </div>
  </div>

  <!-- Galería de Fotos como Pétalos -->
  <div class="galeria">
    <!-- Foto Juntos -->
    <div class="foto-petalo" onclick="console.log('Click en Foto Juntos')">
      <img src="imagen1.png" alt="Foto Juntos">
    </div>

    <!-- Arenita 1 (Arenita de espaldas) -->
    <div class="foto-petalo foto-arena" onclick="console.log('Click en Arenita 1')">
      <img src="imagen2.png" alt="Arenita De Espaldas">
    </div>

    <!-- Arenita 2 (Arenita sonriendo) -->
    <div class="foto-petalo foto-arena" onclick="console.log('Click en Arenita 2')">
      <img src="imagen3.png" alt="Arenita Sonriendo">
    </div>

    <!-- Arenita 3 (Arenita perfil) -->
    <div class="foto-petalo foto-arena" onclick="console.log('Click en Arenita 3')">
      <img src="imagen4.png" alt="Arenita De Perfil">
    </div>
  </div>

</body>
</html>
