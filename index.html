<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¡Para Ti, Arenita! 🌻</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      /* --- NUEVO: FONDO CON TU FOTO --- */
      background-image: url('foto2.jpg'); /* Usamos tu foto de campo */
      background-size: cover; /* Para que cubra toda la pantalla */
      background-position: center center;
      background-attachment: fixed; /* Mantiene el fondo fijo al hacer scroll */
      /* -------------------------------- */
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo animado sutil de flores y corazones */
    .bg-element {
      position: absolute;
      user-select: none;
      pointer-events: none;
      opacity: 0.9; /* Un poco más visible sobre la foto */
      animation: float 4s ease-in-out infinite alternate;
      z-index: 1; /* Detrás de todo */
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(10deg); }
    }

    /* Contenedor Superior (Tarjeta + Bob + Arenita) */
    .hero-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 900px;
      margin-top: 20px;
      margin-bottom: 50px;
      z-index: 10;
    }

    .character {
      width: 180px;
      height: auto;
      z-index: 5;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
    }

    .bob {
      margin-right: -40px;
    }

    .sandy {
      margin-left: -40px;
    }

    /* Tarjeta Central: Retocada para que resalte sobre la foto de fondo */
    .main-card {
      background: rgba(17, 24, 39, 0.88); /* Más oscuro y opaco */
      backdrop-filter: blur(12px);
      border: 2px solid rgba(250, 204, 21, 0.5); /* Borde amarillo más visible */
      border-radius: 20px;
      padding: 30px 40px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      z-index: 3;
    }

    .main-card h2 {
      color: #facc15;
      font-size: 1.8rem;
      margin-bottom: 15px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .main-card p {
      font-size: 1rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 25px;
    }

    .btn {
      background-color: #facc15;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.5);
    }

    .btn:hover {
      background-color: #fef08a;
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.7);
    }

    /* Galería de Fotos Abajo: Animación y Bordes */
    .photo-gallery {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 1100px;
      z-index: 10;
      margin-bottom: 30px;
    }

    .photo-card {
      background: rgba(17, 24, 39, 0.7); /* Fondo de tarjeta sutil */
      backdrop-filter: blur(5px);
      padding: 10px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      width: 220px;
      border: 2px solid rgba(250, 204, 21, 0.2); /* Borde sutil */
    }

    /* --- NUEVO: FOTOS MÁS ANIMADAS --- */
    .photo-card:hover {
      transform: translateY(-12px) scale(1.05) rotate(1deg); /* Más movimiento */
      border: 2px solid rgba(250, 204, 21, 0.8); /* Resalta el borde */
      box-shadow: 0 15px 35px rgba(250, 204, 21, 0.4);
    }
    /* ---------------------------------- */

    .photo-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

    /* Lluvia de Flores interactiva (más intensa) */
    .falling-flower {
      position: fixed;
      top: -20px;
      font-size: 26px;
      user-select: none;
      pointer-events: none;
      z-index: 100;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }

    /* Soporte para móviles */
    @media (max-width: 768px) {
      .hero-wrapper {
        flex-direction: column;
      }
      .bob, .sandy {
        margin: 0;
        width: 140px;
      }
      .main-card {
        max-width: 90%;
        padding: 20px;
      }
      .photo-gallery {
        gap: 15px;
      }
      .photo-card {
        width: 45%;
      }
    }
  </style>
</head>
<body>

  <!-- Flores y Corazones Decorativos de Fondo -->
  <div class="bg-element" style="top: 8%; left: 10%; font-size: 2.2rem;">💛</div>
  <div class="bg-element" style="top: 15%; left: 25%; font-size: 2rem;">🌻</div>
  <div class="bg-element" style="top: 6%; right: 15%; font-size: 2.2rem;">💛</div>
  <div class="bg-element" style="top: 18%; right: 30%; font-size: 2rem;">🌻</div>

  <!-- Sección Principal con Bob, Arenita y Tarjeta -->
  <div class="hero-wrapper">
    <!-- Bob Esponja: Usamos imagen directo de su wiki oficial para asegurar carga -->
    <img class="character bob" src="https://assets.nick.com/uri/mgid:arc:imageassetref:shared.nick.com:a60d6258-8422-4217-a065-2766028a381a?quality=0.7&gen=nt&width=400&height=400&crop=true" alt="Bob Esponja">

    <!-- Tarjeta Central -->
    <div class="main-card">
      <h2>¡Para Ti, Arenita! 🌻</h2>
      <p>
        Un girasol digital y una aventura submarina para iluminar tu día. Tu sonrisa brilla con la misma fuerza que el sol de Fondo de Bikini. ¡Gracias por existir!
      </p>
      <button class="btn" onclick="createFlowerRain()">¡Enviar más Flores de Fondo de Bikini! 🌼</button>
    </div>

    <!-- Arenita: Usamos imagen directo de su wiki oficial -->
    <img class="character sandy" src="https://assets.nick.com/uri/mgid:arc:imageassetref:shared.nick.com:c791d211-1376-47a3-b0e6-591781297d21?quality=0.7&gen=nt&width=400&height=400&crop=true" alt="Arenita">
  </div>

  <!-- Galería de Fotografías con Efectos Animados -->
  <div class="photo-gallery">
    <!-- He simplificado el HTML para quitar el círculo, las fotos rectangulares se ven más profesionales en este diseño -->
    <div class="photo-card">
      <img src="foto1.jpg" alt="Recuerdo especial 1">
    </div>
    <div class="photo-card">
      <img src="foto2.jpg" alt="Recuerdo especial 2">
    </div>
    <div class="photo-card">
      <img src="foto3.jpg" alt="Recuerdo especial 3">
    </div>
    <div class="photo-card">
      <img src="foto4.jpg" alt="Recuerdo especial 4">
    </div>
  </div>

  <script>
    function createFlowerRain() {
      // Flores más variadas y temáticas
      const symbols = ['🌻', '🌼', '✨', '💛', '🪸', '🐚'];
      for (let i = 0; i < 25; i++) { // Más flores
        setTimeout(() => {
          const flower = document.createElement('div');
          flower.classList.add('falling-flower');
          flower.innerText = symbols[Math.floor(Math.random() * symbols.length)];
          flower.style.left = Math.random() * 100 + 'vw';
          flower.style.animationDuration = Math.random() * 3 + 2.5 + 's'; // Variación de velocidad
          flower.style.fontSize = Math.random() * 15 + 22 + 'px'; // Variación de tamaño
          document.body.appendChild(flower);

          setTimeout(() => { flower.remove(); }, 5500);
        }, i * 110); // Más rápido
      }
    }
  </script>
</body>
</html>
