<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Para Ti, Arenita! 🌻</title>
  <style>
    :root {
      --amarillo-girasol: #ffcc00;
      --dorado-calido: #ffa500;
      --fondo-suave: #fffdf0;
      --texto-oscuro: #2c2c2c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--fondo-suave);
      color: var(--texto-oscuro);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* --- PORTADA CON FOTO DE FONDO (foto2.jpg) --- */
    .hero-header {
      position: relative;
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.55)), 
                  url('foto2.jpg') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      padding: 20px;
    }

    .hero-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 35px 25px;
      border-radius: 24px;
      max-width: 650px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      animation: fadeIn 1.2s ease-out;
      z-index: 2;
    }

    .personajes-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .personajes-header img {
      width: 55px;
      height: 55px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .hero-card h1 {
      font-size: 2.4rem;
      color: var(--amarillo-girasol);
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    .hero-card p {
      font-size: 1.15rem;
      line-height: 1.5;
      margin-bottom: 25px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    .btn-flores {
      display: inline-block;
      background: linear-gradient(135deg, #ffcc00, #ffa500);
      color: #000;
      font-weight: bold;
      font-size: 1.05rem;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 204, 0, 0.4);
      transition: all 0.3s ease;
    }

    .btn-flores:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 25px rgba(255, 204, 0, 0.6);
    }

    .btn-flores:active {
      transform: scale(0.95);
    }

    /* --- ANIMACIÓN DE LLUVIAS --- */
    .elemento-lluvia {
      position: fixed;
      top: -120px;
      pointer-events: none;
      z-index: 9999;
      user-select: none;
      animation: caer linear forwards;
    }

    .elemento-lluvia.imagen {
      object-fit: cover;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    /* FORMA 1: MARCO DE CORAZÓN */
    .forma-corazon {
      clip-path: path('M 50 15 C 35 -10, -5 20, 50 90 C 105 20, 65 -10, 50 15 Z');
    }

    /* FORMA 2: MARCO DE GIRASOL (FLOR) */
    .forma-girasol {
      clip-path: polygon(
        50% 0%, 61% 11%, 75% 2%, 81% 16%, 96% 12%, 96% 28%, 100% 40%, 93% 52%, 
        100% 65%, 90% 74%, 93% 90%, 77% 91%, 70% 100%, 55% 93%, 43% 100%, 
        30% 92%, 18% 97%, 13% 82%, 0% 77%, 5% 62%, 0% 48%, 10% 38%, 4% 22%, 
        20% 18%, 24% 3%, 40% 9%
      );
    }

    @keyframes caer {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      80% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .hero-card h1 { font-size: 1.8rem; }
      .hero-card p { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- PORTADA CON FOTO2.JPG DE FONDO -->
  <header class="hero-header">
    <div class="hero-card">
      <div class="personajes-header">
        <!-- Bob Esponja -->
        <img src="https://upload.wikimedia.org/wikipedia/en/3/3b/SpongeBob_SquarePants_character.svg" alt="Bob Esponja">
        <span>🌻</span>
        <!-- Arenita -->
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a0/Sandy_Cheeks.svg" alt="Arenita">
      </div>
      
      <h1>¡Para Ti, Arenita! 🌻</h1>
      <p>Un girasol digital y una aventura submarina para iluminar tu día.<br>
      Tu sonrisa brilla con la misma fuerza que el sol de Fondo de Bikini. ¡Gracias por existir!</p>
      
      <button class="btn-flores" id="btnLluvia">¡Ver las Flores de Fondo de Bikini! 🌼</button>
    </div>
  </header>

  <!-- JAVASCRIPT PARA HACER LLOVER ELEMENTOS E IMÁGENES CON MARCOS ESPECIALES -->
  <script>
    const btnLluvia = document.getElementById('btnLluvia');
    
    // Lista de elementos que van a llover
    const simbolos = ['🌻', '🌼', '💛', '✨', '🌸', '💖'];
    const imagenes = ['foto1.jpg', 'foto3.jpg', 'foto4.jpg'];

    btnLluvia.addEventListener('click', () => {
      // Lanzar una ráfaga de 35 elementos
      for (let i = 0; i < 35; i++) {
        setTimeout(() => {
          crearElementoLluvia();
        }, i * 120);
      }
    });

    function crearElementoLluvia() {
      const esImagen = Math.random() < 0.45; // 45% de probabilidad de ser una foto
      const el = esImagen ? document.createElement('img') : document.createElement('div');

      el.classList.add('elemento-lluvia');

      if (esImagen) {
        el.classList.add('imagen');
        
        // Asignar aleatoriamente la forma de corazón o girasol
        if (Math.random() < 0.5) {
          el.classList.add('forma-corazon');
        } else {
          el.classList.add('forma-girasol');
        }

        // Elige una imagen aleatoria
        const imgAleatoria = imagenes[Math.floor(Math.random() * imagenes.length)];
        el.src = imgAleatoria;
        
        // Tamaños para las fotos en la lluvia
        const tamano = Math.random() * 50 + 70; // entre 70px y 120px
        el.style.width = `${tamano}px`;
        el.style.height = `${tamano}px`;
      } else {
        // Elige un símbolo aleatorio
        el.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
        const tamanoTexto = Math.random() * 25 + 20;
        el.style.fontSize = `${tamanoTexto}px`;
      }

      // Posición horizontal aleatoria
      const posX = Math.random() * (window.innerWidth - 80);
      el.style.left = `${posX}px`;

      // Tiempo de caída aleatorio
      const duracion = Math.random() * 3 + 3;
      el.style.animationDuration = `${duracion}s`;

      document.body.appendChild(el);

      // Eliminar el elemento del DOM al finalizar
      setTimeout(() => {
        el.remove();
      }, duracion * 1000);
    }
  </script>

</body>
</html>
