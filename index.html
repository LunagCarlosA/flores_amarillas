<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¡Para Ti, Arenita! 🌻</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
      background-image: url('foto2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .bg-element {
      position: absolute;
      user-select: none;
      pointer-events: none;
      opacity: 0.85;
      animation: float 4s ease-in-out infinite alternate;
      z-index: 2;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(10deg); }
    }

    /* Hero Wrapper superpuesto al frente */
    .hero-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      margin: 40px auto 50px auto;
      z-index: 100; /* Prioridad máxima por encima de las burbujas */
    }

    /* Tarjeta Principal superpuesta al frente */
    .main-card {
      background: rgba(23, 37, 65, 0.85);
      backdrop-filter: blur(8px);
      border: 3px solid rgba(250, 204, 21, 0.6);
      border-radius: 20px;
      padding: 35px 30px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.3), 0 10px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 101; /* Asegura estar en el nivel más alto */
    }

    .main-card h2 {
      color: #facc15;
      font-size: 1.8rem;
      margin-bottom: 15px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .main-card p {
      font-size: 1rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .btn {
      background-color: #facc15;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
    }

    .btn:hover {
      background-color: #fef08a;
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.6);
    }

    /* Burbujas laterales de los personajes */
    .character-bubble {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 50%;
      overflow: hidden;
      z-index: 102;
      border: 4px solid #ffffff;
      outline: 3px solid rgba(250, 204, 21, 0.8);
      box-shadow: 
        0 0 20px rgba(250, 204, 21, 0.5),
        0 0 35px rgba(100, 200, 255, 0.6),
        inset 0 0 15px rgba(255, 255, 255, 0.6);
    }

    .character-bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .character-bubble::after {
      content: "";
      position: absolute;
      top: 12%;
      left: 12%;
      width: 28%;
      height: 28%;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      filter: blur(3px);
      pointer-events: none;
    }

    .bob-bubble {
      width: 140px;
      height: 140px;
      left: -100px;
    }

    .sandy-bubble {
      width: 140px;
      height: 140px;
      right: -100px;
    }

    /* Galería de Burbujas Flotantes */
    .photo-gallery {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 4; /* Mantener por debajo de la tarjeta */
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: auto;
      border: 4px solid #ffffff;
      outline: 3px solid rgba(250, 204, 21, 0.8);
      box-shadow: 
        0 0 20px rgba(250, 204, 21, 0.5),
        0 0 35px rgba(100, 200, 255, 0.6),
        inset 0 0 15px rgba(255, 255, 255, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: popAndFadeWide ease-in-out infinite;
      opacity: 0;
    }

    /* Diferentes tamaños */
    .bubble.size-sm { width: 130px; height: 130px; }
    .bubble.size-md { width: 170px; height: 170px; }
    .bubble.size-lg { width: 220px; height: 220px; }
    .bubble.size-xl { width: 260px; height: 260px; }

    /* Recorridos personalizados por toda la pantalla con desfasamiento de tiempo */
    .bubble:nth-child(1) {
      top: 10%; left: 5%;
      animation-duration: 12s;
      animation-delay: 0s;
      --tx-mid: 40vw; --ty-mid: 30vh;
      --tx-end: 80vw; --ty-end: 60vh;
    }
    .bubble:nth-child(2) {
      top: 70%; left: 10%;
      animation-duration: 14s;
      animation-delay: 2.5s;
      --tx-mid: 35vw; --ty-mid: -40vh;
      --tx-end: 75vw; --ty-end: -20vh;
    }
    .bubble:nth-child(3) {
      top: 15%; right: 5%;
      animation-duration: 13s;
      animation-delay: 4.5s;
      --tx-mid: -45vw; --ty-mid: 40vh;
      --tx-end: -80vw; --ty-end: 10vh;
    }
    .bubble:nth-child(4) {
      top: 65%; right: 8%;
      animation-duration: 15s;
      animation-delay: 1.5s;
      --tx-mid: -30vw; --ty-mid: -50vh;
      --tx-end: -70vw; --ty-end: -10vh;
    }
    .bubble:nth-child(5) {
      top: 40%; left: 45%;
      animation-duration: 11s;
      animation-delay: 6s;
      --tx-mid: -35vw; --ty-mid: -30vh;
      --tx-end: 40vw; --ty-end: 40vh;
    }

    /* Animación de aparecer/desaparecer con movimiento continuo amplio por la pantalla */
    @keyframes popAndFadeWide {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.3);
      }
      20% {
        opacity: 1;
        transform: translate(calc(var(--tx-mid) * 0.3), calc(var(--ty-mid) * 0.3)) scale(1);
      }
      50% {
        opacity: 1;
        transform: translate(var(--tx-mid), var(--ty-mid)) scale(1.05);
      }
      80% {
        opacity: 0.8;
        transform: translate(calc(var(--tx-end) * 0.8), calc(var(--ty-end) * 0.8)) scale(0.9);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx-end), var(--ty-end)) scale(0.3);
      }
    }

    .bubble:hover {
      transform: scale(1.15) !important;
      z-index: 10;
      outline-color: #facc15;
      box-shadow: 
        0 0 30px rgba(250, 204, 21, 0.9), 
        0 0 50px rgba(100, 200, 255, 0.8),
        inset 0 0 25px rgba(255, 255, 255, 0.8);
    }

    .bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .bubble::after {
      content: "";
      position: absolute;
      top: 12%;
      left: 12%;
      width: 28%;
      height: 28%;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      filter: blur(3px);
      pointer-events: none;
    }

    .falling-flower {
      position: fixed;
      top: -20px;
      font-size: 24px;
      user-select: none;
      pointer-events: none;
      z-index: 200;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(105vh) rotate(360deg); }
    }

    @media (max-width: 768px) {
      .hero-wrapper {
        max-width: 82%;
      }
      .bob-bubble {
        width: 90px;
        height: 90px;
        left: -50px;
      }
      .sandy-bubble {
        width: 90px;
        height: 90px;
        right: -50px;
      }
      .bubble.size-sm { width: 90px; height: 90px; }
      .bubble.size-md { width: 120px; height: 120px; }
      .bubble.size-lg { width: 150px; height: 150px; }
      .bubble.size-xl { width: 180px; height: 180px; }
    }
  </style>
</head>
<body>

  <!-- Elementos decorativos de fondo -->
  <div class="bg-element" style="top: 8%; left: 10%; font-size: 2rem;">💛</div>
  <div class="bg-element" style="top: 12%; left: 22%; font-size: 1.8rem;">🌻</div>
  <div class="bg-element" style="top: 6%; right: 15%; font-size: 2rem;">💛</div>
  <div class="bg-element" style="top: 15%; right: 25%; font-size: 1.8rem;">🌻</div>

  <!-- Sección Central -->
  <div class="hero-wrapper">
    <!-- Burbuja Bob Esponja a la izquierda -->
    <div class="character-bubble bob-bubble">
      <img src="el.jpg" alt="Bob Esponja">
    </div>

    <!-- Tarjeta Principal -->
    <div class="main-card">
      <h2>¡Para Ti, Arenita! 🌻</h2>
      <p>
        Un girasol digital y una aventura submarina para iluminar tu día. Tu sonrisa brilla con la misma fuerza que el sol de Fondo de Bikini. ¡Gracias por existir!
      </p>
      <button class="btn" onclick="createFlowerRain()">¡Enviar más Flores de Fondo de Bikini! 🌼</button>
    </div>

    <!-- Burbuja Arenita a la derecha -->
    <div class="character-bubble sandy-bubble">
      <img src="ella.jpg" alt="Arenita">
    </div>
  </div>

  <!-- Burbujas Flotantes con Marcos y Diferentes Tamaños -->
  <div class="photo-gallery">
    <div class="bubble size-lg">
      <img src="foto1.jpg" alt="Foto 1">
    </div>
    <div class="bubble size-xl">
      <img src="foto3.jpg" alt="Foto 3">
    </div>
    <div class="bubble size-md">
      <img src="foto4.jpg" alt="Foto 4">
    </div>
    <div class="bubble size-sm">
      <img src="burbujas.jpg" alt="Bob y Arenita en burbuja">
    </div>
    <div class="bubble size-lg">
      <img src="burbujas1.jpg" alt="Bob y Arenita en la playa">
    </div>
  </div>

  <script>
    function createFlowerRain() {
      const symbols = ['🌻', '🌼', '✨', '💛', '🪸'];
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const flower = document.createElement('div');
          flower.classList.add('falling-flower');
          flower.innerText = symbols[Math.floor(Math.random() * symbols.length)];
          flower.style.left = Math.random() * 100 + 'vw';
          flower.style.animationDuration = Math.random() * 3 + 2 + 's';
          flower.style.fontSize = Math.random() * 15 + 20 + 'px';
          document.body.appendChild(flower);

          setTimeout(() => { flower.remove(); }, 5000);
        }, i * 120);
      }
    }
  </script>
</body>
</html>
