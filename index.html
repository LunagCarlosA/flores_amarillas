<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¡Para Ti, Arenita! 🌻</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
      background-image: url('foto2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .bg-element {
      position: absolute;
      user-select: none;
      pointer-events: none;
      opacity: 0.85;
      animation: float 4s ease-in-out infinite alternate;
      z-index: 2;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(10deg); }
    }

    .hero-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      margin: 40px auto 50px auto;
      z-index: 3;
    }

    .main-card {
      background: rgba(23, 37, 65, 0.85);
      backdrop-filter: blur(8px);
      border: 3px solid rgba(250, 204, 21, 0.6);
      border-radius: 20px;
      padding: 35px 30px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.3), 0 10px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 3;
    }

    .main-card h2 {
      color: #facc15;
      font-size: 1.8rem;
      margin-bottom: 15px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .main-card p {
      font-size: 1rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .btn {
      background-color: #facc15;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
    }

    .btn:hover {
      background-color: #fef08a;
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.6);
    }

    /* Ajuste de personajes y mezcla de color para disimular fondo blanco */
    .character {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: auto;
      z-index: 5;
      pointer-events: none;
      /* Oculta/mezcla fondos claros o blancos */
      mix-blend-mode: multiply;
      filter: contrast(110%) brightness(105%);
    }

    .bob {
      width: 150px;
      left: -110px;
    }

    .sandy {
      width: 130px;
      right: -90px;
    }

    /* Burbujas flotantes con marco degradado y efecto Neón */
    .photo-gallery {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 4;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: auto;
      /* Marco brillante de doble borde */
      border: 4px solid #ffffff;
      outline: 3px solid rgba(250, 204, 21, 0.8);
      box-shadow: 
        0 0 20px rgba(250, 204, 21, 0.5),
        0 0 35px rgba(100, 200, 255, 0.6),
        inset 0 0 15px rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
      animation: floatAround linear infinite alternate;
    }

    .bubble.size-sm { width: 130px; height: 130px; }
    .bubble.size-md { width: 170px; height: 170px; }
    .bubble.size-lg { width: 220px; height: 220px; }
    .bubble.size-xl { width: 260px; height: 260px; }

    .bubble:nth-child(1) {
      top: 8%; left: 4%;
      animation-duration: 14s;
    }
    .bubble:nth-child(2) {
      top: 55%; left: 8%;
      animation-duration: 18s;
      animation-direction: alternate-reverse;
    }
    .bubble:nth-child(3) {
      top: 15%; right: 5%;
      animation-duration: 16s;
    }
    .bubble:nth-child(4) {
      top: 60%; right: 10%;
      animation-duration: 20s;
      animation-direction: alternate-reverse;
    }
    .bubble:nth-child(5) {
      top: 45%; left: 42%;
      animation-duration: 13s;
    }

    .bubble:hover {
      transform: scale(1.15);
      z-index: 10;
      outline-color: #facc15;
      box-shadow: 
        0 0 30px rgba(250, 204, 21, 0.9), 
        0 0 50px rgba(100, 200, 255, 0.8),
        inset 0 0 25px rgba(255, 255, 255, 0.8);
    }

    .bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes floatAround {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(50px, -60px) rotate(4deg); }
      50% { transform: translate(-40px, 50px) rotate(-4deg); }
      75% { transform: translate(60px, 30px) rotate(2deg); }
      100% { transform: translate(-50px, -40px) rotate(-2deg); }
    }

    .bubble::after {
      content: "";
      position: absolute;
      top: 12%;
      left: 12%;
      width: 28%;
      height: 28%;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      filter: blur(3px);
      pointer-events: none;
    }

    .falling-flower {
      position: fixed;
      top: -20px;
      font-size: 24px;
      user-select: none;
      pointer-events: none;
      z-index: 100;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(105vh) rotate(360deg); }
    }

    @media (max-width: 768px) {
      .hero-wrapper {
        max-width: 82%;
      }
      .bob {
        width: 100px;
        left: -55px;
      }
      .sandy {
        width: 85px;
        right: -45px;
      }
      .bubble.size-sm { width: 90px; height: 90px; }
      .bubble.size-md { width: 120px; height: 120px; }
      .bubble.size-lg { width: 150px; height: 150px; }
      .bubble.size-xl { width: 180px; height: 180px; }
    }
  </style>
</head>
<body>

  <!-- Elementos decorativos de fondo -->
  <div class="bg-element" style="top: 8%; left: 10%; font-size: 2rem;">💛</div>
  <div class="bg-element" style="top: 12%; left: 22%; font-size: 1.8rem;">🌻</div>
  <div class="bg-element" style="top: 6%; right: 15%; font-size: 2rem;">💛</div>
  <div class="bg-element" style="top: 15%; right: 25%; font-size: 1.8rem;">🌻</div>

  <!-- Sección Central -->
  <div class="hero-wrapper">
    <!-- Bob Esponja a la izquierda -->
    <img class="character bob" src="bobEsponja.png" alt="Bob Esponja con Uculele">

    <!-- Tarjeta Principal con marco brillante -->
    <div class="main-card">
      <h2>¡Para Ti, Arenita! 🌻</h2>
      <p>
        Un girasol digital y una aventura submarina para iluminar tu día. Tu sonrisa brilla con la misma fuerza que el sol de Fondo de Bikini. ¡Gracias por existir!
      </p>
      <button class="btn" onclick="createFlowerRain()">¡Enviar más Flores de Fondo de Bikini! 🌼</button>
    </div>

    <!-- Arenita a la derecha -->
    <img class="character sandy" src="arenita.png" alt="Arenita Mejilla">
  </div>

  <!-- Burbujas Flotantes con Marcos -->
  <div class="photo-gallery">
    <div class="bubble size-lg">
      <img src="foto1.jpg" alt="Foto 1">
    </div>
    <div class="bubble size-xl">
      <img src="foto3.jpg" alt="Foto 3">
    </div>
    <div class="bubble size-md">
      <img src="foto4.jpg" alt="Foto 4">
    </div>
    <div class="bubble size-md">
      <img src="burbujas.jpg" alt="Bob y Arenita en burbuja">
    </div>
    <div class="bubble size-lg">
      <img src="burbujas1.jpg" alt="Bob y Arenita en la playa">
    </div>
  </div>

  <script>
    function createFlowerRain() {
      const symbols = ['🌻', '🌼', '✨', '💛', '🪸'];
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const flower = document.createElement('div');
          flower.classList.add('falling-flower');
          flower.innerText = symbols[Math.floor(Math.random() * symbols.length)];
          flower.style.left = Math.random() * 100 + 'vw';
          flower.style.animationDuration = Math.random() * 3 + 2 + 's';
          flower.style.fontSize = Math.random() * 15 + 20 + 'px';
          document.body.appendChild(flower);

          setTimeout(() => { flower.remove(); }, 5000);
        }, i * 120);
      }
    }
  </script>
</body>
</html>
